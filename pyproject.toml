[project]
name = "neural-op2"
version = "0.1.0"
description = "working file for neural operator learning applications"
readme = "README.md"
authors = [
    { email = "erickzhome@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "neuraloperator>=2.0.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "torch>=2.14.0",
]

[project.scripts]
neural-op2 = "neural_op2:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
